<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logout | Smart Parking</title>

<style>
body{
margin:0;
padding:0;
font-family:Segoe UI,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(135deg,#081b33,#0d2c52);
padding:20px;
}

.box{
background:white;
padding:40px;
border-radius:18px;
width:350px;
max-width:100%;
text-align:center;
box-shadow:0 15px 30px rgba(0,0,0,0.3);
}

h1{
color:#081b33;
margin-bottom:10px;
}

p{
color:#666;
margin-bottom:25px;
}

button{
padding:12px 22px;
margin:8px;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
width:45%;
}

.yes{
background:#00c6ff;
color:white;
}

.no{
background:#ddd;
}

@media(max-width:480px){

.box{
padding:25px;
}

button{
width:100%;
margin:6px 0;
}

h1{
font-size:22px;
}

p{
font-size:14px;
}
}
</style>
</head>

<body>

<div class="box">
<h1>Logout</h1>
<p>Are you sure you want to logout?</p>

<button class="yes" onclick="logout()">Yes Logout</button>
<button class="no" onclick="cancelLogout()">Cancel</button>
</div>

<script>
function logout(){
localStorage.removeItem("loggedIn");
alert("Logged Out Successfully");
window.location.href="index.html";
}

function cancelLogout(){
window.location.href="home.html";
}
</script>

</body>
</html>
